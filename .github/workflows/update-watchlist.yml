name: Update Investment Watchlist

on:
  workflow_dispatch:

  schedule:
    - cron: "15 22 * * 5"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Refresh Cloudflare dataset
        run: |
          curl --fail \
            --retry 3 \
            --retry-delay 5 \
            --max-time 180 \
            "https://jolly-bird-cef3investment-watchlist-api.mr-balvers.workers.dev/?refresh=1" \
            -o latest.json

      - name: Validate dataset
        run: |
          python3 - <<'PY'
          import json
          import sys

          with open("latest.json", "r") as f:
              data = json.load(f)

          if data.get("ok") is not True:
              print("ERROR: Dataset is not OK")
              sys.exit(1)

          successful = data.get("instruments_successful", 0)
          completeness = data.get("data_quality", {}).get(
              "completeness_percent", 0
          )

          print("Successful instruments:", successful)
          print("Completeness:", completeness)

          if successful < 35:
              print("ERROR: Too few successful instruments")
              sys.exit(1)

          if completeness < 95:
              print("ERROR: Completeness below 95%")
              sys.exit(1)

          print("Dataset validation passed")
          PY

      - name: Commit updated dataset
        run: |
          git config user.name "watchlist-bot"
          git config user.email "watchlist-bot@users.noreply.github.com"

          git add latest.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update weekly investment watchlist"
            git push
          fi
